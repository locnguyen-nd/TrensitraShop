spring.application.name=${SPRING_APPLICATION_NAME:TrendistaShop}
server.port=${SERVER_PORT:8080}
api.prefix=${API_PREFIX:/api/v1}
frontend.dev.url=${FRONTEND_DEV_URL:http://localhost:3000}
frontend.prod.url=${FRONTEND_PROD_URL:http://localhost:4000}
admin.dev.url=${ADMIN_DEV_URL:http://localhost:5173}
admin.prod.url=${ADMIN_PROD_URL:http://localhost:5183}
#jdbc connect
# Cau hinh localhost
#spring.datasource.url=jdbc:mysql://localhost:3306/trendista_database
#spring.datasource.username=root
#spring.datasource.password=${DB_PASSWORD}
# Cau hinh docker
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:trendista}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

#Cau hinh server railway
#spring.datasource.url=jdbc:mysql://junction.proxy.rlwy.net:18453/trendista
#spring.datasource.username=root
#spring.datasource.password=${RAILWAY_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
search.suggestion.limit=${SEARCH_SUGGESTION_LIMIT:5}
# Enable multipart uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Open API
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.enabled=true
application-title = API TRENDISTA 

#JWT
jwt.auth.app=trendistaShop
jwt.auth.secret_key=${JWT_SECRET_KEY}
jwt.auth.expires_in=${JWT_EXPIRES_IN:86400}
jwt.auth.refresh_token.expires_in=${JWT_REFRESH_TOKEN_EXPIRES_IN:604800}
jwt.auth.verification.expires_in=${JWT_VERIFICATION_EXPIRES_IN:86400}

#Verification
verification.max_attempts=${VERIFICATION_MAX_ATTEMPTS:5}

#Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.backup-email=${BACKUP_EMAIL}


#OAuth2 Google
#clientID : ${GOOGLE_CLIENT_ID}
#secret : ${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

#logging.level.org.springframework.security=DEBUG

# VietQR Configuration
vietqr.client-id=${VIETQR_CLIENT_ID}
vietqr.api-key=${VIETQR_API_KEY}
vietqr.account-no=${VIETQR_ACCOUNT_NO}
vietqr.account-name=${VIETQR_ACCOUNT_NAME}
vietqr.bank-id=${VIETQR_BANK_ID}

# PayOS Configuration
PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID}
PAYOS_API_KEY=${PAYOS_API_KEY}
PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY}
PAYOS_RETURN_URL=${PAYOS_RETURN_URL:http://localhost:8080/api/v1/order/payment/success}
PAYOS_CANCEL_URL=${PAYOS_CANCEL_URL:http://localhost:8080/api/v1/payment/cancel}



# Development-specific configuration for hot reload
# Spring DevTools configuration for optimal hot reload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729

# Optimized restart timing to prevent double restart
spring.devtools.restart.poll-interval=500
spring.devtools.restart.quiet-period=200

# Watch source directories for changes
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.restart.exclude=static/**,public/**,target/**

# Enable automatic restart on classpath changes
spring.devtools.restart.log-condition-evaluation-delta=false

# Disable caching for development
spring.thymeleaf.cache=false
spring.freemarker.cache=false
spring.velocity.cache=false
spring.mustache.cache=false

# Optimized logging for development
logging.level.com.trendistra.trendistashop=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.devtools=DEBUG
