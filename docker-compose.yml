services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trendista
      MYSQL_PASSWORD: root
    ports:
      - "3308:3306"
    networks:
      - trendista-network
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 15s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trendista-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9093:9093"
    networks:
      - trendista-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trendista
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  trendista-network: {}

volumes:
  mysql_data:
