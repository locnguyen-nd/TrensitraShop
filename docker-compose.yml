name: trendista
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trendista
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 15s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: trendista-backend:latest
    container_name: trendista-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9093:9093"
    environment:
      SPRING_PROFILES_ACTIVE: production
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
