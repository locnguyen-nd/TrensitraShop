services:
  mysql-dev:
    image: mysql:8.0
    container_name: mysql-container-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trendista
      MYSQL_PASSWORD: root
    ports:
      - "3308:3306"
    networks:
      - trendista-network
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 15s

  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: trendista-backend-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "5005:5005"
    networks:
      - trendista-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-dev:3306/trendista
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_PROFILES_ACTIVE: dev
      # devtools trigger file inside /app
      # SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_RESTART_TRIGGER_FILE: .restart
      # SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 1s
      # SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: 300ms
      # SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "false"
    depends_on:
      mysql-dev:
        condition: service_healthy
    volumes:
      # ✅ mount entire workspace so Maven/DevTools see **everything**
      - ./:/app:delegated
      # ✅ speed up builds
      - ~/.m2/repository:/root/.m2/repository:delegated
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  trendista-network: {}

volumes:
  mysql_data_dev:
