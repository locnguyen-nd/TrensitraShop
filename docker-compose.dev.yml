name: trendista-dev
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trendista
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 15s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: trendista-backend-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "35729:35729"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./src:/app/src:rw
      - ./pom.xml:/app/pom.xml:ro
      - ./target:/app/target:rw
      - maven_cache:/root/.m2
      - ./src/main/resources/application.properties:/app/src/main/resources/application.properties:ro
    tty: true
    stdin_open: true

volumes:
  mysql_data_dev:
  maven_cache:
